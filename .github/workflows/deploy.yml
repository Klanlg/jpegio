name: Build and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

# Include the event name in the group so the two runs a release fires (the tag
# push and the `release: published` event share the same ref) don't cancel each
# other -- otherwise the publishing `release` run can be killed by the tag-push
# run, which does not publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; Intel macOS wheels are cross-compiled there
        # (macos-13 Intel runners are being retired and queue indefinitely).
        os: [ windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install NASM (Windows, for SIMD)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install nasm -y

      - name: Build and install (default C-API backend)
        run: pip install -v .
        
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl



