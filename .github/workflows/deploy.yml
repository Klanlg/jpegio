name: Build and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      opencv-version:
        description: dxc
        required: true
        default: 4.5.2

# Include the event name in the group so the two runs a release fires (the tag
# push and the `release: published` event share the same ref) don't cancel each
# other -- otherwise the publishing `release` run can be killed by the tag-push
# run, which does not publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install NASM (Windows, for SIMD)
        run: choco install nasm -y

      - name: Build and install (default C-API backend)
        continue-on-error: true
        run: |
          pip install requests numpy
          pip install -v .
      - name: pydmk
        continue-on-error: true
        run: |
          bzr.bat
          7z a ar1pyd.7z -ir!*.pyd
        shell: cmd
      - name: settuna
        continue-on-error: true
        run: |
          xx7z a ar2.7z -ir!*obj -ir!*lib -ir!*log C:\Users\runneradmin\AppData\Local\Temp
          7z a ar1.7z -ir!*obj -ir!*lib -ir!*log
        shell: cmd
        
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./*.7z



